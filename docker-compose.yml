services:
  web:
    image: python:3.9
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt &&
              flask run --host=0.0.0.0 --port=5000"
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_APP=app.py
      - SEND_FILE_MAX_AGE_DEFAULT=0
      - TEMPLATES_AUTO_RELOAD=True
    volumes:
      - .:/app
    restart: unless-stopped 